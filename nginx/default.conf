# ==============================================================================
# DATAEKO × meshIQ Partner Dashboard — Production Ingress Reverse Proxy
# ==============================================================================
# Architecture:
# - /       -> Next.js Standalone Frontend (http://frontend:3000)
# - /api/v1 -> FastAPI Backend API Gateway (http://backend:8000/api/v1)
# ==============================================================================

# Upstream Backend Pool
upstream backend_service {
    server backend:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Upstream Frontend Pool
upstream frontend_service {
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum Request Payload Size (aligned with MAX_REQUEST_BODY_BYTES <= 10MB)
    client_max_body_size 10M;

    # Gzip Compression for static and dynamic text payloads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # Defensive Ingress Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Determine correlation request ID (preserve incoming or assign request_id)
    set $req_id $http_x_request_id;
    if ($req_id = "") {
        set $req_id $request_id;
    }

    # --------------------------------------------------------------------------
    # 1. API Gateway Routing (/api/v1/)
    # --------------------------------------------------------------------------
    location /api/v1/ {
        proxy_pass http://backend_service/api/v1/;
        proxy_http_version 1.1;

        # Connection and header preservation
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $req_id;

        # Streaming and payload handling (non-buffering)
        proxy_buffering off;
        proxy_request_buffering off;

        # Operational Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 2. Next.js Frontend Application Routing (/)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;

        # Header forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Request-ID $req_id;

        # WebSocket support (for live client upgrades)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Operational Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
