name: CI/CD & Production Release Gates

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_images:
        description: 'Publish production container images to registry (main branch or release tags only)'
        type: boolean
        default: false
      deploy_target:
        description: 'Deployment target environment hook (main branch or release tags only)'
        type: choice
        options:
          - none
          - staging
          - production
        default: 'none'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' && !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  # ==============================================================================
  # 1. Backend Unit, API & Observability Tests
  # ==============================================================================
  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio pytest-cov httpx

      - name: Run Canonical Backend Tests
        run: |
          PYTHONPATH=backend pytest backend/tests/ -v --ignore=backend/tests/calculation_engine/test_golden_masters.py

  # ==============================================================================
  # 2. Golden Master Release Gate (Strict Calculation Contract)
  # ==============================================================================
  golden-masters:
    name: Golden Master Calculations Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: Run Strict Golden Master Test Suite
        run: |
          PYTHONPATH=backend pytest backend/tests/calculation_engine/test_golden_masters.py -v --tb=short

  # ==============================================================================
  # 3. Frontend Unit & Integration Tests (Vitest)
  # ==============================================================================
  frontend-tests:
    name: Frontend Vitest Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Vitest Suite (Forks Pool)
        run: npm run test -- --pool=forks

  # ==============================================================================
  # 4. Frontend TypeScript Validation
  # ==============================================================================
  frontend-typecheck:
    name: Frontend TypeScript Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate TypeScript Compilation
        run: npx tsc --project tsconfig.json --noEmit

  # ==============================================================================
  # 5. Security & Fail-Closed Production Configuration Gate
  # ==============================================================================
  security-prod-config:
    name: Security & Hardening Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio httpx

      - name: Run Security and Production Configuration Tests
        run: |
          PYTHONPATH=backend pytest backend/tests/security/ -v

  # ==============================================================================
  # 6. Frontend Production Build Gate
  # ==============================================================================
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Standalone Next.js Application
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: /api/v1
        run: npm run build

  # ==============================================================================
  # 7. Docker Image & Production Compose Validation
  # ==============================================================================
  docker-build-check:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Development Docker Compose Configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate Production Docker Compose Configuration
        env:
          DATABASE_URL: postgresql+asyncpg://meshiq_user:placeholder_pass@db:5432/meshiq
          JWT_SECRET: placeholder_jwt_secret_key_minimum_32_characters_for_validation
          POSTGRES_PASSWORD: placeholder_postgres_password
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build Backend Docker Image
        run: docker build -t meshiq-backend:ci ./backend

      - name: Build Frontend Docker Image (Same-Origin Default)
        run: docker build -t meshiq-frontend:ci --build-arg NEXT_PUBLIC_API_URL=/api/v1 ./frontend

  # ==============================================================================
  # 8. Real-Stack Browser-to-Backend E2E Suite (Playwright)
  # ==============================================================================
  e2e-browser-suite:
    name: Browser-to-Backend E2E Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt asyncpg alembic uvicorn

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Optional Playwright Browser Cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772115f6710 # v4.2.2
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium with OS Dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@127.0.0.1:5432/testdb
          ENVIRONMENT: test
        run: |
          cd backend
          alembic upgrade head

      - name: Seed Deterministic E2E Fixtures
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@127.0.0.1:5432/testdb
          ENVIRONMENT: test
        run: |
          PYTHONPATH=backend python3 backend/scripts/seed_e2e.py

      - name: Launch FastAPI Backend Server
        run: |
          EPHEMERAL_JWT_SECRET=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
          ENVIRONMENT=test \
          DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@127.0.0.1:5432/testdb \
          JWT_SECRET=$EPHEMERAL_JWT_SECRET \
          CORS_ORIGINS='["http://localhost:3000","http://127.0.0.1:3000"]' \
          TRUSTED_PROXIES='["127.0.0.1"]' \
          SECURE_COOKIES=false \
          RATE_LIMIT_ENABLED=true \
          RATE_LIMIT_LOGIN_PER_MINUTE=30 \
          PYTHONPATH=backend nohup python3 -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &

      - name: Await Backend Health Probe Readiness
        run: |
          python3 -c "
          import urllib.request, time, sys, os
          for i in range(30):
              try:
                  res = urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)
                  if res.status == 200:
                      print('✅ FastAPI backend is healthy and ready on 127.0.0.1:8000')
                      sys.exit(0)
              except Exception:
                  time.sleep(1)
          print('❌ FastAPI backend failed to reach ready state within 30 seconds')
          if os.path.exists('/tmp/backend.log'):
              print('=== /tmp/backend.log ===')
              with open('/tmp/backend.log', 'r') as f:
                  print(f.read())
              print('========================')
          sys.exit(1)
          "

      - name: Build and Launch Next.js Frontend Server
        working-directory: frontend
        run: |
          NEXT_TELEMETRY_DISABLED=1 \
          NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1 \
          npm run build
          PORT=3000 nohup npm run start -- -p 3000 > /tmp/frontend.log 2>&1 &

      - name: Await Frontend HTTP Readiness
        run: |
          python3 -c "
          import urllib.request, time, sys
          for i in range(30):
              try:
                  res = urllib.request.urlopen('http://127.0.0.1:3000/', timeout=2)
                  if res.status in (200, 307, 308):
                      print('✅ Next.js frontend is ready on 127.0.0.1:3000')
                      sys.exit(0)
              except Exception:
                  time.sleep(1)
          print('❌ Next.js frontend failed to start within 30 seconds')
          sys.exit(1)
          "

      - name: Execute Playwright Browser E2E Suite (4 spec files / 10 tests)
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright Report on Failure
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Playwright Failure Traces & Screenshots
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 14

  # ==============================================================================
  # 9. Deterministic Executive PDF Generation & Structural Validation Gate
  # ==============================================================================
  report-pdf-gate:
    name: Executive PDF Generation Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.11 (for validation script)
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Install Frontend Dependencies
        run: npm ci --legacy-peer-deps

      - name: Optional Playwright Browser Cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772115f6710 # v4.2.2
        id: playwright-pdf-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Generate Deterministic Executive PDF
        run: node scripts/generate_pdf.mjs

      - name: Validate Structural PDF Integrity
        run: |
          python3 -c "
          import os, sys

          pdf_path = '../docs/artifacts/DATAEKO_meshIQ_Executive_Assessment_Report.pdf'
          if not os.path.isfile(pdf_path):
              print('❌ PDF file missing at expected path:', pdf_path)
              sys.exit(1)

          size = os.path.getsize(pdf_path)
          if size < 50000:
              print(f'❌ PDF sanity size check failed: size {size} bytes is unusually small')
              sys.exit(1)

          with open(pdf_path, 'rb') as f:
              content = f.read()

          if not content.startswith(b'%PDF-'):
              print('❌ Invalid PDF: missing %PDF- magic header at byte 0')
              sys.exit(1)

          if b'%%EOF' not in content[-2048:]:
              print('❌ Invalid PDF: missing %%EOF trailer marker')
              sys.exit(1)

          page_count = content.count(b'/Type /Page')
          if page_count < 2:
              print(f'❌ PDF structural page verification failed: found {page_count} page objects')
              sys.exit(1)

          print(f'✅ PDF structurally verified: {size} bytes, valid header, trailer, and {page_count} pages.')
          "

      - name: Upload Generated PDF Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: executive-assessment-report
          path: docs/artifacts/DATAEKO_meshIQ_Executive_Assessment_Report.pdf
          retention-days: 30

  # ==============================================================================
  # 10. Consolidated Quality & Release Gate
  # ==============================================================================
  release-gate:
    name: Consolidated Quality Release Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-tests
      - golden-masters
      - frontend-tests
      - frontend-typecheck
      - security-prod-config
      - frontend-build
      - docker-build-check
      - e2e-browser-suite
      - report-pdf-gate
    steps:
      - name: Audit All Upstream Gates
        run: |
          echo "=========================================================="
          echo "RELEASE GATE AUDIT EVALUATION"
          echo "=========================================================="
          RESULTS=(
            "backend-tests: ${{ needs.backend-tests.result }}"
            "golden-masters: ${{ needs.golden-masters.result }}"
            "frontend-tests: ${{ needs.frontend-tests.result }}"
            "frontend-typecheck: ${{ needs.frontend-typecheck.result }}"
            "security-prod-config: ${{ needs.security-prod-config.result }}"
            "frontend-build: ${{ needs.frontend-build.result }}"
            "docker-build-check: ${{ needs.docker-build-check.result }}"
            "e2e-browser-suite: ${{ needs.e2e-browser-suite.result }}"
            "report-pdf-gate: ${{ needs.report-pdf-gate.result }}"
          )

          FAILED=0
          for item in "${RESULTS[@]}"; do
            echo "  $item"
            if [[ ! "$item" =~ :[[:space:]]success$ ]]; then
              FAILED=1
            fi
          done

          echo "=========================================================="
          if [ $FAILED -ne 0 ]; then
            echo "❌ RELEASE GATE REJECTED: One or more upstream jobs failed, was cancelled, or was skipped."
            exit 1
          fi
          echo "✅ ALL REQUIRED RELEASE GATES PASSED! RELEASE AUTHORIZED."

  # ==============================================================================
  # 11. Build Provenance & Auditable Metadata Packaging
  # ==============================================================================
  package-metadata:
    name: Build Metadata & Provenance Packaging
    runs-on: ubuntu-latest
    needs:
      - release-gate
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate Build Provenance Metadata
        run: |
          mkdir -p build-artifacts
          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          GIT_SHA="${{ github.sha }}"
          GIT_REF="${{ github.ref }}"
          GIT_REF_NAME="${{ github.ref_name }}"

          cat <<EOF > build-artifacts/build-metadata.json
          {
            "project": "DATAEKO × meshIQ Partner Dashboard",
            "commit_sha": "${GIT_SHA}",
            "git_ref": "${GIT_REF}",
            "git_ref_name": "${GIT_REF_NAME}",
            "build_timestamp": "${BUILD_TIMESTAMP}",
            "immutable_image_tags": [
              "sha-${GIT_SHA::8}",
              "${GIT_SHA}"
            ],
            "release_tag": "${GIT_REF_NAME}",
            "pipeline_version": "1.0.0"
          }
          EOF

          echo "=========================================================="
          echo "AUDITABLE BUILD METADATA GENERATED"
          echo "=========================================================="
          cat build-artifacts/build-metadata.json
          echo ""

      - name: Upload Build Metadata Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: build-metadata
          path: build-artifacts/build-metadata.json
          retention-days: 90

  # ==============================================================================
  # 12. Controlled Container Publishing (Release Tags & Main Branch Manual Dispatch Only)
  # ==============================================================================
  publish-images:
    name: Publish Production Images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_images == true)
    needs:
      - release-gate
      - package-metadata
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Authorized Release Ref
        run: |
          echo "=========================================================="
          echo "RELEASE REF AUTHORIZATION CHECK"
          echo "=========================================================="
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"

          if [[ "$REF" =~ ^refs/tags/v ]] || [[ "$EVENT" == "workflow_dispatch" && "$REF" == "refs/heads/main" ]]; then
            echo "✅ Ref '$REF' authorized for production image publication."
          else
            echo "❌ UNAUTHORIZED: Production image publication is only permitted from release tags ('refs/tags/v*') or the main branch ('refs/heads/main')."
            echo "   Current ref: $REF (Event: $EVENT)"
            exit 1
          fi

      - name: Fail-Closed Registry Configuration Audit
        env:
          REGISTRY_SERVER: ${{ secrets.REGISTRY_SERVER }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "=========================================================="
          echo "REGISTRY CREDENTIALS AUDIT (FAIL-CLOSED)"
          echo "=========================================================="
          MISSING_REGISTRY=0

          if [ -n "$REGISTRY_SERVER" ]; then
            echo "REGISTRY_SERVER: configured"
          else
            echo "REGISTRY_SERVER: NOT CONFIGURED"
            MISSING_REGISTRY=1
          fi

          if [ -n "$REGISTRY_USERNAME" ]; then
            echo "REGISTRY_USERNAME: configured"
          else
            echo "REGISTRY_USERNAME: NOT CONFIGURED"
            MISSING_REGISTRY=1
          fi

          if [ -n "$REGISTRY_PASSWORD" ]; then
            echo "REGISTRY_PASSWORD: configured (masked)"
          else
            echo "REGISTRY_PASSWORD: NOT CONFIGURED"
            MISSING_REGISTRY=1
          fi

          echo "=========================================================="
          if [ $MISSING_REGISTRY -ne 0 ]; then
            echo "❌ CRITICAL: Explicit production image publication requested, but required registry secrets are missing."
            echo "   Failing closed: Production images will NOT report successful publication without registry credentials."
            exit 1
          fi

      - name: Build Production Images with Immutable Tags
        env:
          IMAGE_TAG: ${{ github.sha }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          echo "Building production backend image with immutable tags..."
          docker build \
            -t meshiq-backend:${IMAGE_TAG} \
            -t meshiq-backend:${REF_TAG} \
            ./backend

          echo "Building production frontend image with immutable tags..."
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=/api/v1 \
            -t meshiq-frontend:${IMAGE_TAG} \
            -t meshiq-frontend:${REF_TAG} \
            ./frontend

          echo "✅ Production container images built successfully."

      - name: Push to Container Registry & Record Image Provenance
        env:
          REGISTRY_SERVER: ${{ secrets.REGISTRY_SERVER }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_SERVER" -u "$REGISTRY_USERNAME" --password-stdin

          docker tag meshiq-backend:${IMAGE_TAG} ${REGISTRY_SERVER}/meshiq-backend:${IMAGE_TAG}
          docker tag meshiq-backend:${REF_TAG} ${REGISTRY_SERVER}/meshiq-backend:${REF_TAG}
          docker tag meshiq-frontend:${IMAGE_TAG} ${REGISTRY_SERVER}/meshiq-frontend:${IMAGE_TAG}
          docker tag meshiq-frontend:${REF_TAG} ${REGISTRY_SERVER}/meshiq-frontend:${REF_TAG}

          docker push ${REGISTRY_SERVER}/meshiq-backend:${IMAGE_TAG}
          docker push ${REGISTRY_SERVER}/meshiq-backend:${REF_TAG}
          docker push ${REGISTRY_SERVER}/meshiq-frontend:${IMAGE_TAG}
          docker push ${REGISTRY_SERVER}/meshiq-frontend:${REF_TAG}
          echo "✅ Images published to ${REGISTRY_SERVER} with immutable tags: ${IMAGE_TAG}, ${REF_TAG}"

          # Extract actual pushed registry manifest digests from RepoDigests
          BACKEND_REGISTRY_DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{.}}{{"\n"}}{{end}}' "${REGISTRY_SERVER}/meshiq-backend:${IMAGE_TAG}" | grep -E "^${REGISTRY_SERVER}/meshiq-backend@" | head -n 1 | awk -F'@' '{print $2}')
          if [ -z "$BACKEND_REGISTRY_DIGEST" ]; then
            BACKEND_REGISTRY_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${REGISTRY_SERVER}/meshiq-backend:${IMAGE_TAG}" 2>/dev/null | awk -F'@' '{print $2}')
          fi

          DIGEST_REGEX="^sha256:[0-9a-f]{64}$"

          if [[ ! "$BACKEND_REGISTRY_DIGEST" =~ $DIGEST_REGEX ]]; then
            echo "❌ ERROR: Backend image registry manifest digest is invalid or could not be determined."
            echo "   Extracted value: '$BACKEND_REGISTRY_DIGEST'"
            echo "   Failing closed: Remote registry digest validation failed."
            exit 1
          fi

          FRONTEND_REGISTRY_DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{.}}{{"\n"}}{{end}}' "${REGISTRY_SERVER}/meshiq-frontend:${IMAGE_TAG}" | grep -E "^${REGISTRY_SERVER}/meshiq-frontend@" | head -n 1 | awk -F'@' '{print $2}')
          if [ -z "$FRONTEND_REGISTRY_DIGEST" ]; then
            FRONTEND_REGISTRY_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${REGISTRY_SERVER}/meshiq-frontend:${IMAGE_TAG}" 2>/dev/null | awk -F'@' '{print $2}')
          fi

          if [[ ! "$FRONTEND_REGISTRY_DIGEST" =~ $DIGEST_REGEX ]]; then
            echo "❌ ERROR: Frontend image registry manifest digest is invalid or could not be determined."
            echo "   Extracted value: '$FRONTEND_REGISTRY_DIGEST'"
            echo "   Failing closed: Remote registry digest validation failed."
            exit 1
          fi

          BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          mkdir -p build-artifacts
          cat <<EOF > build-artifacts/image-provenance.json
          {
            "project": "DATAEKO × meshIQ Partner Dashboard",
            "commit_sha": "${IMAGE_TAG}",
            "release_tag": "${REF_TAG}",
            "registry_server": "${REGISTRY_SERVER}",
            "published_at": "${BUILD_TIMESTAMP}",
            "artifacts": {
              "backend": {
                "image": "${REGISTRY_SERVER}/meshiq-backend",
                "tag": "${IMAGE_TAG}",
                "release_tag": "${REF_TAG}",
                "registry_digest": "${BACKEND_REGISTRY_DIGEST}"
              },
              "frontend": {
                "image": "${REGISTRY_SERVER}/meshiq-frontend",
                "tag": "${IMAGE_TAG}",
                "release_tag": "${REF_TAG}",
                "registry_digest": "${FRONTEND_REGISTRY_DIGEST}"
              }
            }
          }
          EOF

          echo "=========================================================="
          echo "IMAGE PROVENANCE RECORDED WITH VERIFIED REGISTRY DIGESTS"
          echo "=========================================================="
          cat build-artifacts/image-provenance.json
          echo ""

      - name: Upload Image Provenance Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: image-provenance
          path: build-artifacts/image-provenance.json
          retention-days: 90

  # ==============================================================================
  # 13. Production Deployment Gate & Hook (Provider-Neutral)
  # ==============================================================================
  deploy-production-hook:
    name: Production Deployment Hook
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy_target == 'production')
    needs:
      - release-gate
      - package-metadata
      - publish-images
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Authorized Release Ref for Deployment
        run: |
          echo "=========================================================="
          echo "DEPLOYMENT REF AUTHORIZATION CHECK"
          echo "=========================================================="
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"

          if [[ "$REF" =~ ^refs/tags/v ]] || [[ "$EVENT" == "workflow_dispatch" && "$REF" == "refs/heads/main" ]]; then
            echo "✅ Ref '$REF' authorized for production deployment."
          else
            echo "❌ UNAUTHORIZED: Production deployment is only permitted from release tags ('refs/tags/v*') or the main branch ('refs/heads/main')."
            echo "   Current ref: $REF (Event: $EVENT)"
            exit 1
          fi

      - name: Production Configuration Diagnostics Gate
        env:
          PROD_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PROD_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          PROD_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PROD_CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          PROD_TRUSTED_PROXY_IPS: ${{ secrets.TRUSTED_PROXY_IPS }}
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "=========================================================="
          echo "PRODUCTION CONFIGURATION READINESS AUDIT"
          echo "=========================================================="
          MISSING_CONFIG=0

          if [ -n "$PROD_JWT_SECRET" ]; then
            echo "JWT_SECRET: configured"
          else
            echo "JWT_SECRET: NOT CONFIGURED"
            MISSING_CONFIG=1
          fi

          if [ -n "$PROD_POSTGRES_PASSWORD" ]; then
            echo "POSTGRES_PASSWORD: configured"
          else
            echo "POSTGRES_PASSWORD: NOT CONFIGURED"
            MISSING_CONFIG=1
          fi

          if [ -n "$PROD_DATABASE_URL" ]; then
            echo "DATABASE_URL: configured"
          else
            echo "DATABASE_URL: NOT CONFIGURED (Operator must provide)"
          fi

          if [ -n "$PROD_CORS_ORIGINS" ]; then
            echo "CORS_ORIGINS: configured"
          else
            echo "CORS_ORIGINS: using default/fallback"
          fi

          if [ -n "$PROD_TRUSTED_PROXY_IPS" ]; then
            echo "TRUSTED_PROXY_IPS: configured"
          else
            echo "TRUSTED_PROXY_IPS: using default/fallback"
          fi

          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            echo "DEPLOY_WEBHOOK_URL: configured"
          else
            echo "DEPLOY_WEBHOOK_URL: NOT CONFIGURED"
            MISSING_CONFIG=1
          fi

          echo "=========================================================="
          if [ $MISSING_CONFIG -ne 0 ]; then
            echo "❌ CRITICAL: Required production secrets/webhook are missing from repository secret store."
            echo "   Failing closed: Production deployment hook cannot execute without required target configuration."
            exit 1
          fi

          echo "Triggering operator-configured deployment hook..."
          curl -s -f -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"ref\": \"${{ github.ref }}\", \"sha\": \"${{ github.sha }}\"}"
          echo "✅ Deployment webhook triggered successfully."
