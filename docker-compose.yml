services:
  # ==============================================================================
  # Database Service (PostgreSQL 16)
  # ==============================================================================
  db:
    image: postgres:16-alpine
    container_name: meshiq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meshiq}
      POSTGRES_USER: ${POSTGRES_USER:-meshiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meshiq_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-meshiq_user} -d $${POSTGRES_DB:-meshiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - meshiq_network

  # ==============================================================================
  # Backend API Service (FastAPI)
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meshiq_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://meshiq_user:meshiq_secure_pass_2026@db:5432/meshiq}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_key_change_in_production_32char_minimum_}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      DEBUG: ${DEBUG:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - meshiq_network

  # ==============================================================================
  # Frontend Service (Next.js Standalone)
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: meshiq_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - meshiq_network

# ==============================================================================
# Persistent Volumes & Networks
# ==============================================================================
volumes:
  postgres_data:

networks:
  meshiq_network:
    driver: bridge
